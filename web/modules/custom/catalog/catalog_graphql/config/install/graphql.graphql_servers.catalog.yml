langcode: en
status: true
name: catalog
label: Catalog
schema: composable
schema_configuration:
  composable:
    extensions:
      catalog: catalog
endpoint: /graphql/catalog
debug_flag: 0
caching: true
batching: true
disable_introspection: false
# The schema is cyclic (product -> prices -> customer -> prices -> ...), so
# bound how deep a query may go. GraphiQL's introspection query is 11 deep and
# is not exempt from this rule, so the limit must stay above that or the
# explorer cannot load the schema. Real protection is the endpoint permission
# plus the page limits; this only stops absurd nesting.
query_depth: 12
query_complexity: 200
persisted_queries_settings: {  }
