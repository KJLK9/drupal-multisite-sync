import_engine.import_definition.*:
  type: config_entity
  label: 'Import definition'
  constraints:
    FullyValidatable: ~
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    description:
      type: text
      label: 'Description'
      constraints:
        NotNull: ~
    source:
      type: import_engine.source_reference
      label: 'Source'
    pagination:
      type: import_engine.plugin_reference
      label: 'Pagination'
    authentication:
      type: import_engine.authentication_reference
      label: 'Authentication'
    target:
      type: mapping
      label: 'Target'
      mapping:
        entity_type:
          type: string
          label: 'Entity type'
          constraints:
            NotBlank: ~
            Regex:
              pattern: '/^[a-z][a-z0-9_]*$/'
              message: 'The entity type must be a machine name.'
        bundle:
          type: string
          label: 'Bundle'
          constraints:
            NotBlank: ~
            Regex:
              pattern: '/^[a-z][a-z0-9_]*$/'
              message: 'The bundle must be a machine name.'
    mapping:
      type: sequence
      label: 'Field mapping'
      sequence:
        type: import_engine.mapping_row
    delete_policy:
      type: string
      label: 'Delete policy'
      constraints:
        Choice:
          callback: 'Drupal\import_engine\DeletePolicy::values'
    resilience:
      type: mapping
      label: 'Resilience'
      mapping:
        max_attempts:
          type: integer
          label: 'Maximum attempts per item'
          constraints:
            Range:
              min: 1
              max: 20
        backoff:
          type: string
          label: 'Backoff strategy'
          constraints:
            Choice:
              callback: 'Drupal\import_engine\BackoffStrategy::values'
        dlq_enabled:
          type: boolean
          label: 'Keep failed items in the dead letter queue'
    pool:
      type: string
      label: 'Worker pool'
      constraints:
        Regex:
          pattern: '/^[a-z][a-z0-9_]*$/'
          message: 'The pool must be a machine name.'

# A source plugin; its configuration is typed per plugin.
import_engine.source_reference:
  type: mapping
  label: 'Source'
  mapping:
    plugin:
      type: string
      label: 'Plugin ID'
      constraints:
        PluginExists:
          manager: plugin.manager.import_engine_source
          interface: 'Drupal\import_engine\Source\SourceInterface'
    configuration:
      type: 'import_engine.source.[%parent.plugin]'
      label: 'Plugin configuration'

# An authentication plugin; its configuration is typed per plugin.
import_engine.authentication_reference:
  type: mapping
  label: 'Authentication'
  mapping:
    plugin:
      type: string
      label: 'Plugin ID'
      constraints:
        PluginExists:
          manager: plugin.manager.import_engine_authentication
          interface: 'Drupal\import_engine\Authentication\AuthenticationInterface'
    configuration:
      type: 'import_engine.authentication.[%parent.plugin]'
      label: 'Plugin configuration'

import_engine.source.http:
  type: mapping
  label: 'HTTP source'
  mapping:
    url:
      type: string
      label: 'URL'
      constraints:
        NotBlank: ~
        Regex:
          # No query string or fragment: parameters go in "query", so secrets
          # and paging values never end up in URLs in messages.
          pattern: '/^https?:\/\/[^?#\s]+$/'
          message: 'The URL must start with http:// or https:// and have no query string; use the query setting.'
    method:
      type: string
      label: 'Method'
      constraints:
        Choice: [GET, POST]
    headers:
      type: sequence
      label: 'Headers'
      sequence:
        type: string
        label: 'Header value'
        constraints:
          NotNull: ~
          Regex:
            pattern: '/^[^\r\n]*$/'
            message: 'A header value cannot contain line breaks.'
    query:
      type: sequence
      label: 'Query parameters'
      sequence:
        type: string
        label: 'Parameter value'
        constraints:
          NotNull: ~
    body:
      type: string
      label: 'Body (JSON)'
      constraints:
        NotNull: ~
        Callback:
          callback: ['Drupal\import_engine\Plugin\ImportEngine\Source\HttpSource', 'validateJsonBody']
    items_path:
      type: string
      label: 'Path of the list of items'
      constraints:
        NotNull: ~
        Regex:
          pattern: '/^$|^[A-Za-z0-9_@#-]+(\.[A-Za-z0-9_@#-]+)*$/'
          message: 'A path is dotted names, for example data.customers.items.'
    id_path:
      type: string
      label: 'Path of the id in an item'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[A-Za-z0-9_@#-]+(\.[A-Za-z0-9_@#-]+)*$/'
          message: 'A path is dotted names, for example customer.id.'
    timeout:
      type: integer
      label: 'Timeout in seconds'
      constraints:
        Range:
          min: 1
          max: 300
    format:
      type: string
      label: 'Response format'
      constraints:
        Choice:
          callback: 'Drupal\import_engine\Decoder\ResponseDecoder::formats'
    csv_delimiter:
      type: string
      label: 'CSV delimiter'
      constraints:
        Length:
          min: 1
          max: 1

import_engine.authentication.none:
  type: mapping
  label: 'No authentication'
  mapping: {}

import_engine.authentication.api_key_header:
  type: mapping
  label: 'API key in a header'
  mapping:
    header:
      type: string
      label: 'Header name'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[A-Za-z0-9-]+$/'
          message: 'A header name is letters, digits and dashes.'
    env_var:
      type: string
      label: 'Environment variable that holds the key'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[A-Z][A-Z0-9_]*$/'
          message: 'An environment variable name is upper case letters, digits and underscores.'

# A plugin and its configuration, not yet typed per plugin (pagination).
import_engine.plugin_reference:
  type: mapping
  label: 'Plugin'
  mapping:
    plugin:
      type: string
      label: 'Plugin ID'
      constraints:
        Regex:
          pattern: '/^[a-z][a-z0-9_]*$/'
          message: 'The plugin ID must be a machine name.'
    configuration:
      type: ignore
      label: 'Plugin configuration'

# One row of the field mapping: a mapper fills one target field from named
# source values. Each mapper declares which sources it needs.
import_engine.mapping_row:
  type: mapping
  label: 'Mapping row'
  mapping:
    target_field:
      type: string
      label: 'Target field'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[a-z][a-z0-9_]*$/'
          message: 'The target field must be a machine name.'
    mapper:
      type: mapping
      label: 'Mapper'
      mapping:
        plugin:
          type: string
          label: 'Mapper plugin ID'
          constraints:
            Regex:
              pattern: '/^[a-z][a-z0-9_]*$/'
              message: 'The plugin ID must be a machine name.'
        sources:
          type: sequence
          label: 'Source values'
          sequence:
            type: string
            label: 'Dotted path in the source item'
            constraints:
              NotBlank: ~
              Regex:
                pattern: '/^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)*$/'
                message: 'A source path is dotted names, for example price.customer.customer_code.'
        settings:
          type: ignore
          label: 'Mapper settings'
