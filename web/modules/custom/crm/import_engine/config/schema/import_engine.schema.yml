import_engine.import_definition.*:
  type: config_entity
  label: 'Import definition'
  constraints:
    FullyValidatable: ~
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    description:
      type: text
      label: 'Description'
      constraints:
        NotNull: ~
    source:
      type: import_engine.source_reference
      label: 'Source'
    source_key:
      type: sequence
      label: 'Key paths that identify a source item'
      constraints:
        Count:
          min: 1
          max: 5
      sequence:
        type: string
        label: 'Dotted path in the source item'
        constraints:
          NotBlank: ~
          Regex:
            pattern: '/^[A-Za-z0-9_@#-]+(\.[A-Za-z0-9_@#-]+)*$/'
            message: 'A key path is dotted names, for example customer.code.'
    pagination:
      type: import_engine.pagination_reference
      label: 'Pagination'
    authentication:
      type: import_engine.authentication_reference
      label: 'Authentication'
    target:
      type: import_engine.target_reference
      label: 'Target'
    mapping:
      type: sequence
      label: 'Field mapping'
      sequence:
        type: import_engine.mapping_row
    delete_policy:
      type: string
      label: 'Delete policy'
      constraints:
        Choice:
          callback: 'Drupal\import_engine\DeletePolicy::values'
    delete_threshold_percent:
      type: integer
      label: 'Most items, in percent, that may go missing in one run'
      constraints:
        Range:
          min: 0
          max: 100
    reporters:
      type: sequence
      label: 'Reporters'
      sequence:
        type: import_engine.reporter_reference
    resilience:
      type: mapping
      label: 'Resilience'
      mapping:
        max_attempts:
          type: integer
          label: 'Maximum attempts per item'
          constraints:
            Range:
              min: 1
              max: 20
        backoff:
          type: string
          label: 'Backoff strategy'
          constraints:
            Choice:
              callback: 'Drupal\import_engine\BackoffStrategy::values'
        retry_delay:
          type: integer
          label: 'Seconds before the first retry of a failed item'
          constraints:
            Range:
              min: 1
              max: 86400
        dlq_enabled:
          type: boolean
          label: 'Keep failed items in the dead letter queue'
        max_repeated_pages:
          type: integer
          label: 'Stop extraction after this many repeated pages in a row'
          constraints:
            Range:
              min: 1
              max: 20
    pool:
      type: string
      label: 'Worker pool'
      constraints:
        Regex:
          pattern: '/^[a-z][a-z0-9_]*$/'
          message: 'The pool must be a machine name.'

# A source plugin; its configuration is typed per plugin.
import_engine.source_reference:
  type: mapping
  label: 'Source'
  mapping:
    plugin:
      type: string
      label: 'Plugin ID'
      constraints:
        PluginExists:
          manager: plugin.manager.import_engine_source
          interface: 'Drupal\import_engine\Source\SourceInterface'
    configuration:
      type: 'import_engine.source.[%parent.plugin]'
      label: 'Plugin configuration'

# An authentication plugin; its configuration is typed per plugin.
import_engine.authentication_reference:
  type: mapping
  label: 'Authentication'
  mapping:
    plugin:
      type: string
      label: 'Plugin ID'
      constraints:
        PluginExists:
          manager: plugin.manager.import_engine_authentication
          interface: 'Drupal\import_engine\Authentication\AuthenticationInterface'
    configuration:
      type: 'import_engine.authentication.[%parent.plugin]'
      label: 'Plugin configuration'

import_engine.source.http:
  type: mapping
  label: 'HTTP source'
  mapping:
    url:
      type: string
      label: 'URL'
      constraints:
        NotBlank: ~
        Regex:
          # No query string or fragment: parameters go in "query", so secrets
          # and paging values never end up in URLs in messages.
          pattern: '/^https?:\/\/[^?#\s]+$/'
          message: 'The URL must start with http:// or https:// and have no query string; use the query setting.'
    method:
      type: string
      label: 'Method'
      constraints:
        Choice: [GET, POST]
    headers:
      type: sequence
      label: 'Headers'
      sequence:
        type: string
        label: 'Header value'
        constraints:
          NotNull: ~
          Regex:
            pattern: '/^[^\r\n]*$/'
            message: 'A header value cannot contain line breaks.'
    query:
      type: sequence
      label: 'Query parameters'
      sequence:
        type: string
        label: 'Parameter value'
        constraints:
          NotNull: ~
    body:
      type: string
      label: 'Body (JSON)'
      constraints:
        NotNull: ~
        Callback:
          callback: ['Drupal\import_engine\Plugin\ImportEngine\Source\HttpSource', 'validateJsonBody']
    items_path:
      type: string
      label: 'Path of the list of items'
      constraints:
        NotNull: ~
        Regex:
          pattern: '/^$|^[A-Za-z0-9_@#-]+(\.[A-Za-z0-9_@#-]+)*$/'
          message: 'A path is dotted names, for example data.customers.items.'
    timeout:
      type: integer
      label: 'Timeout in seconds'
      constraints:
        Range:
          min: 1
          max: 300
    format:
      type: string
      label: 'Response format'
      constraints:
        Choice:
          callback: 'Drupal\import_engine\Decoder\ResponseDecoder::formats'
    csv_delimiter:
      type: string
      label: 'CSV delimiter'
      constraints:
        Length:
          min: 1
          max: 1

import_engine.authentication.none:
  type: mapping
  label: 'No authentication'
  mapping: {}

import_engine.authentication.api_key_header:
  type: mapping
  label: 'API key in a header'
  mapping:
    header:
      type: string
      label: 'Header name'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[A-Za-z0-9-]+$/'
          message: 'A header name is letters, digits and dashes.'
    env_var:
      type: string
      label: 'Environment variable that holds the key'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[A-Z][A-Z0-9_]*$/'
          message: 'An environment variable name is upper case letters, digits and underscores.'

# A target plugin; its configuration is typed per plugin.
import_engine.target_reference:
  type: mapping
  label: 'Target'
  mapping:
    plugin:
      type: string
      label: 'Plugin ID'
      constraints:
        PluginExists:
          manager: plugin.manager.import_engine_target
          interface: 'Drupal\import_engine\Target\TargetInterface'
    configuration:
      type: 'import_engine.target.[%parent.plugin]'
      label: 'Plugin configuration'

import_engine.target.entity:
  type: mapping
  label: 'Entity target'
  mapping:
    entity_type:
      type: string
      label: 'Entity type'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[a-z][a-z0-9_]*$/'
          message: 'The entity type must be a machine name.'
    bundle:
      type: string
      label: 'Bundle'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[a-z][a-z0-9_]*$/'
          message: 'The bundle must be a machine name.'
    owner:
      type: integer
      label: 'User ID that owns created entities (0: leave the default)'
      constraints:
        Range:
          min: 0

# A pagination plugin; its configuration is typed per plugin.
import_engine.pagination_reference:
  type: mapping
  label: 'Pagination'
  mapping:
    plugin:
      type: string
      label: 'Plugin ID'
      constraints:
        PluginExists:
          manager: plugin.manager.import_engine_pagination
          interface: 'Drupal\import_engine\Pagination\PaginationInterface'
    configuration:
      type: 'import_engine.pagination.[%parent.plugin]'
      label: 'Plugin configuration'

import_engine.pagination.none:
  type: mapping
  label: 'No pagination'
  mapping: {}

# Where a paging value is sent: as a query parameter, or in the JSON body (a
# GraphQL variable, named with a dotted path such as variables.offset).
import_engine.paging_target:
  type: string
  label: 'Send paging values in'
  constraints:
    Choice: [query, body]

import_engine.paging_name:
  type: string
  label: 'Parameter name'
  constraints:
    NotBlank: ~
    Regex:
      pattern: '/^[A-Za-z0-9_@#.\[\]-]+$/'
      message: 'A parameter name is letters, digits and the characters _ - . [ ].'

import_engine.optional_path:
  type: string
  label: 'Dotted path in the response'
  constraints:
    NotNull: ~
    Regex:
      pattern: '/^$|^[A-Za-z0-9_@#-]+(\.[A-Za-z0-9_@#-]+)*$/'
      message: 'A path is dotted names, for example meta.total, or empty.'

import_engine.pagination.offset_limit:
  type: mapping
  label: 'Offset and limit'
  mapping:
    target:
      type: import_engine.paging_target
    offset_param:
      type: import_engine.paging_name
      label: 'Offset parameter'
    limit_param:
      type: import_engine.paging_name
      label: 'Limit parameter'
    page_size:
      type: integer
      label: 'Items per page'
      constraints:
        Range:
          min: 1
          max: 1000
    total_path:
      type: import_engine.optional_path
      label: 'Path of the total number of items'
    stop_on_short_page:
      type: boolean
      label: 'Treat a page shorter than the page size as the last page'

import_engine.pagination.page:
  type: mapping
  label: 'Page number'
  mapping:
    target:
      type: import_engine.paging_target
    page_param:
      type: import_engine.paging_name
      label: 'Page parameter'
    size_param:
      type: string
      label: 'Page size parameter (empty: not sent)'
      constraints:
        NotNull: ~
        Regex:
          pattern: '/^$|^[A-Za-z0-9_@#.\[\]-]+$/'
          message: 'A parameter name is letters, digits and the characters _ - . [ ], or empty.'
    page_size:
      type: integer
      label: 'Items per page'
      constraints:
        Range:
          min: 1
          max: 1000
    first_page:
      type: integer
      label: 'Number of the first page'
      constraints:
        Range:
          min: 0
          max: 1
    total_path:
      type: import_engine.optional_path
      label: 'Path of the total number of items'
    last_page_path:
      type: import_engine.optional_path
      label: 'Path of the number of the last page'

import_engine.pagination.next_url:
  type: mapping
  label: 'Next URL in the response'
  mapping:
    next_path:
      type: string
      label: 'Path of the link to the next page'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[A-Za-z0-9_@#-]+(\.[A-Za-z0-9_@#-]+)*$/'
          message: 'A path is dotted names, for example links.next.href.'
    total_path:
      type: import_engine.optional_path
      label: 'Path of the total number of items'

import_engine.source.graphql:
  type: mapping
  label: 'GraphQL source'
  mapping:
    url:
      type: string
      label: 'URL'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^https?:\/\/[^?#\s]+$/'
          message: 'The URL must start with http:// or https:// and have no query string.'
    query:
      type: string
      label: 'GraphQL query'
      constraints:
        NotBlank: ~
    variables:
      type: string
      label: 'Variables (JSON object)'
      constraints:
        NotNull: ~
        Callback:
          callback: ['Drupal\import_engine\Plugin\ImportEngine\Source\HttpSource', 'validateJsonBody']
    headers:
      type: sequence
      label: 'Headers'
      sequence:
        type: string
        label: 'Header value'
        constraints:
          NotNull: ~
          Regex:
            pattern: '/^[^\r\n]*$/'
            message: 'A header value cannot contain line breaks.'
    items_path:
      type: import_engine.optional_path
      label: 'Path of the list of items'
    timeout:
      type: integer
      label: 'Timeout in seconds'
      constraints:
        Range:
          min: 1
          max: 300

# One row of the field mapping: a mapper fills one target field from named
# source values. Each mapper declares which sources it needs.
import_engine.mapping_row:
  type: mapping
  label: 'Mapping row'
  mapping:
    target_field:
      type: string
      label: 'Target field'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[a-z][a-z0-9_]*$/'
          message: 'The target field must be a machine name.'
    mapper:
      type: mapping
      label: 'Mapper'
      mapping:
        plugin:
          type: string
          label: 'Mapper plugin ID'
          constraints:
            PluginExists:
              manager: plugin.manager.import_engine_mapper
              interface: 'Drupal\import_engine\Mapper\MapperInterface'
        sources:
          type: sequence
          label: 'Source values'
          sequence:
            type: string
            label: 'Dotted path in the source item'
            constraints:
              NotBlank: ~
              Regex:
                pattern: '/^[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)*$/'
                message: 'A source path is dotted names, for example price.customer.customer_code.'
        settings:
          type: 'import_engine.mapper.[%parent.plugin]'
          label: 'Mapper settings'

import_engine.mapper.string:
  type: mapping
  label: 'Text mapper'
  mapping:
    trim:
      type: boolean
      label: 'Remove surrounding white space'
    empty_as_null:
      type: boolean
      label: 'Treat an empty text as no value'

import_engine.mapper.text:
  type: mapping
  label: 'Formatted text mapper'
  mapping:
    format:
      type: string
      label: 'Text format'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[a-z][a-z0-9_]*$/'
          message: 'A text format is a machine name.'

import_engine.mapper.number:
  type: mapping
  label: 'Number mapper'
  mapping: {}

import_engine.mapper.boolean:
  type: mapping
  label: 'Yes or no mapper'
  mapping:
    true_values:
      type: sequence
      label: 'Texts that mean yes'
      sequence:
        type: string
        constraints:
          NotNull: ~
    false_values:
      type: sequence
      label: 'Texts that mean no'
      sequence:
        type: string
        constraints:
          NotNull: ~
    when_empty:
      type: string
      label: 'What a missing value means'
      constraints:
        Choice: [true, false, fail]

import_engine.mapper.timestamp:
  type: mapping
  label: 'Date and time mapper'
  mapping:
    format:
      type: string
      label: 'PHP date format the text follows (empty: anything PHP understands)'
      constraints:
        NotNull: ~

import_engine.mapper.money:
  type: mapping
  label: 'Amount and currency mapper'
  mapping:
    default_currency:
      type: string
      label: 'Currency when the item has none'
      constraints:
        Regex:
          pattern: '/^[A-Z]{3}$/'
          message: 'A currency code is three capital letters.'

import_engine.mapper.reference:
  type: mapping
  label: 'Reference mapper'
  mapping:
    definition:
      type: string
      label: 'Import that wrote the referenced entities'
      constraints:
        NotBlank: ~
        Regex:
          pattern: '/^[a-z][a-z0-9_]*$/'
          message: 'An import ID is a machine name.'
    required:
      type: boolean
      label: 'A missing value or an item not yet imported is a problem'

import_engine.settings:
  type: config_object
  label: 'Import engine settings'
  constraints:
    FullyValidatable: ~
  mapping:
    retention_items_days:
      type: integer
      label: 'Days to keep items that are done'
      constraints:
        Range:
          min: 0
          max: 3650
    retention_dead_days:
      type: integer
      label: 'Days to keep dead items (the dead letter queue)'
      constraints:
        Range:
          min: 0
          max: 3650
    retention_events_days:
      type: integer
      label: 'Days to keep events (the history)'
      constraints:
        Range:
          min: 0
          max: 3650
    retention_runs_days:
      type: integer
      label: 'Days to keep finished runs'
      constraints:
        Range:
          min: 0
          max: 3650
    cron_resume_seconds:
      type: integer
      label: 'Seconds per cron run to continue runs that are not over'
      constraints:
        Range:
          min: 0
          max: 3600

# A reporter plugin; its configuration is typed per plugin.
import_engine.reporter_reference:
  type: mapping
  label: 'Reporter'
  mapping:
    plugin:
      type: string
      label: 'Plugin ID'
      constraints:
        PluginExists:
          manager: plugin.manager.import_engine_reporter
          interface: 'Drupal\import_engine\Reporter\ReporterInterface'
    configuration:
      type: 'import_engine.reporter.[%parent.plugin]'
      label: 'Plugin configuration'

import_engine.reporter.log:
  type: mapping
  label: 'Log reporter'
  mapping:
    only_on_problems:
      type: boolean
      label: 'Only report runs that had problems'

import_engine.reporter.mail:
  type: mapping
  label: 'Mail reporter'
  mapping:
    only_on_problems:
      type: boolean
      label: 'Only report runs that had problems'
    recipients:
      type: sequence
      label: 'Recipients'
      constraints:
        Count:
          min: 1
      sequence:
        type: string
        label: 'Email address'
        constraints:
          Email: ~
