import_engine_ui.runs:
  path: '/admin/config/system/import-engine/runs'
  defaults:
    _controller: 'Drupal\import_engine_ui\Controller\RunController::list'
    _title: 'Import runs'
  requirements:
    _permission: 'view import runs'

import_engine_ui.run:
  path: '/admin/config/system/import-engine/runs/{import_run}'
  defaults:
    _controller: 'Drupal\import_engine_ui\Controller\RunController::view'
    _title_callback: 'Drupal\import_engine_ui\Controller\RunController::title'
  requirements:
    _entity_access: 'import_run.view'
  options:
    parameters:
      import_run:
        type: 'entity:import_run'

import_engine_ui.run_cancel:
  path: '/admin/config/system/import-engine/runs/{import_run}/cancel'
  defaults:
    _form: 'Drupal\import_engine_ui\Form\RunCancelForm'
    _title: 'Cancel run'
  requirements:
    _permission: 'administer import runs'
  options:
    parameters:
      import_run:
        type: 'entity:import_run'

import_engine_ui.dead_letter:
  path: '/admin/config/system/import-engine/dead-letter'
  defaults:
    _form: 'Drupal\import_engine_ui\Form\DeadLetterForm'
    _title: 'Dead letter queue'
  requirements:
    _permission: 'view import runs'

import_engine_ui.dead_letter_edit:
  path: '/admin/config/system/import-engine/dead-letter/{item_id}/edit'
  defaults:
    _form: 'Drupal\import_engine_ui\Form\DeadLetterEditForm'
    _title: 'Edit payload'
  requirements:
    _permission: 'administer import runs'
    item_id: '\d+'

import_engine_ui.breakers:
  path: '/admin/config/system/import-engine/breakers'
  defaults:
    _controller: 'Drupal\import_engine_ui\Controller\BreakerController::list'
    _title: 'Circuit breakers'
  requirements:
    _permission: 'view import runs'

import_engine_ui.breaker_action:
  path: '/admin/config/system/import-engine/breakers/{action}/{endpoint}'
  defaults:
    _form: 'Drupal\import_engine_ui\Form\BreakerActionForm'
    _title: 'Circuit breaker'
  requirements:
    _permission: 'administer import runs'
    action: 'trip|reset'
    endpoint: '[^/]+'

import_engine_ui.definitions:
  path: '/admin/config/system/import-engine/definitions'
  defaults:
    _controller: 'Drupal\import_engine_ui\Controller\DefinitionController::list'
    _title: 'Import definitions'
  requirements:
    _permission: 'administer import definitions'

import_engine_ui.definition_add:
  path: '/admin/config/system/import-engine/definitions/add'
  defaults:
    _form: 'Drupal\import_engine_ui\Form\DefinitionWizardForm'
    _title: 'Add import definition'
  requirements:
    _permission: 'administer import definitions'

import_engine_ui.definition_edit:
  path: '/admin/config/system/import-engine/definitions/{import_definition}/edit'
  defaults:
    _form: 'Drupal\import_engine_ui\Form\DefinitionWizardForm'
    _title: 'Edit import definition'
  requirements:
    _permission: 'administer import definitions'
  options:
    parameters:
      import_definition:
        type: 'entity:import_definition'

import_engine_ui.definition_delete:
  path: '/admin/config/system/import-engine/definitions/{import_definition}/delete'
  defaults:
    _form: 'Drupal\import_engine_ui\Form\DefinitionDeleteForm'
    _title: 'Delete import definition'
  requirements:
    _permission: 'administer import definitions'
  options:
    parameters:
      import_definition:
        type: 'entity:import_definition'

import_engine_ui.definition_run:
  path: '/admin/config/system/import-engine/definitions/{import_definition}/run'
  defaults:
    _form: 'Drupal\import_engine_ui\Form\RunStartForm'
    _title: 'Run import'
  requirements:
    _permission: 'administer import runs'
  options:
    parameters:
      import_definition:
        type: 'entity:import_definition'

import_engine_ui.connections:
  path: '/admin/config/system/import-engine/connections'
  defaults:
    _controller: 'Drupal\import_engine_ui\Controller\ConnectionController::list'
