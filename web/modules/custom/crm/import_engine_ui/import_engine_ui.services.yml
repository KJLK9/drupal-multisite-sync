services:
  import_engine_ui.dead_letter:
    class: Drupal\import_engine_ui\DeadLetter\DeadLetterOperations
    arguments:
      - '@import_engine.item_storage'
      - '@import_engine.process_stage'
      - '@import_engine.event_log'
      - '@entity_type.manager'
      - '@current_user'
      - '@messenger'

  import_engine_ui.run_batch:
    class: Drupal\import_engine_ui\Run\RunBatch
    arguments:
      - '@import_engine.run_driver'
      - '@import_engine.item_storage'
      - '@entity_type.manager'
      - '@current_user'
      - '@messenger'
      - '@datetime.time'

  import_engine_ui.run_set_batch:
    class: Drupal\import_engine_ui\Run\RunSetBatch
    arguments:
      - '@import_engine.run_set_runner'
      - '@entity_type.manager'
      - '@current_user'
      - '@messenger'
      - '@datetime.time'
