# Connects the cluster to Cloudflare, outward only: nothing on this machine is
# opened to the internet. Cloudflare ends TLS and sends the requests through
# the tunnel to the web service, with the host the visitor used. The public
# hostnames are set in the Cloudflare dashboard (docs/tunnel.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels: {app: cloudflared}
  template:
    metadata:
      labels: {app: cloudflared}
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: tunnel-token, key: token}
          livenessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
