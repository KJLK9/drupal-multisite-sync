apiVersion: v1
kind: Service
metadata:
  name: mariadb
spec:
  clusterIP: None
  selector: {app: mariadb}
  ports:
    - {name: mysql, port: 3306}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: {app: mariadb}
  template:
    metadata:
      labels: {app: mariadb}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mariadb
          image: mariadb:11.8
          # Small on purpose: two small sites. The buffer pool is the main
          # lever when there is more memory.
          args:
            - --innodb-buffer-pool-size=128M
            - --performance-schema=OFF
            - --max-connections=60
            - --character-set-server=utf8mb4
            - --transaction-isolation=READ-COMMITTED
          ports:
            - {name: mysql, containerPort: 3306}
          envFrom:
            - secretRef: {name: site-secrets}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: init
          configMap:
            name: mariadb-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
