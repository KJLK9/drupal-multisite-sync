# Only the hosts of the two sites are answered.
#
# A request for any other host is given by Drupal to the site called "default",
# which is not installed and answers with the installer. The hosts are those of
# SITE_A_HOST and SITE_B_HOST, with or without a port. The probes of
# Kubernetes ask by the address of the pod and only fetch /robots.txt. If the
# variables are not set nothing but that file is answered.
<If "%{HTTP_HOST} !~ m#^(${SITE_A_HOST}|${SITE_B_HOST})(:[0-9]+)?$# && %{REQUEST_URI} != '/robots.txt'">
  Require all denied
</If>
