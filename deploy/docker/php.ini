; Settings for running Drupal and the import engine in a container.
memory_limit = 512M
max_execution_time = 120
expose_php = Off
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; The code in the image does not change: do not check the files.
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
; php2shell (October 2026): Drupal does not use the upload progress of the
; session, so it is off. The fix is the PHP patch (8.4.27 and later); this is a
; second layer, not a replacement.
session.upload_progress.enabled = Off
