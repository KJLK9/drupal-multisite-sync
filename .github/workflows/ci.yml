name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_mysql
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
        env:
          GRUMPHP_SKIP_INSTALL: '1'
      - run: composer phpcs
      - run: composer phpstan
      - run: composer rector
      - run: composer test
